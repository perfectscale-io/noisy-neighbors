# A quota so loose it cannot bind. This is the "quota theater" case: the
# namespace looks governed on paper and is not constrained in practice.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: generous
  namespace: team-analytics
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
