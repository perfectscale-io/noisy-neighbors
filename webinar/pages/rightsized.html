<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Right-Sized Cluster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"
        integrity="sha512-vc58qvvBdrDR4etbxMdlTt4GBQk1qjvyORR2nrsPsFPyrs+/u5c3+1Ct6upOgdZoIl7eq6k3a1UPDSNAQi/32A=="
        crossorigin="anonymous"></script>

<style>
  /* The best case, in the same visual grammar as the live wall: a dashed ring
     for what each pod asked for, a solid disc for what it uses. On the live
     page the discs fight their rings. Here every disc sits just inside its
     own, which is the whole picture.

     Light and committed to it, to match the intro and the live view. Every
     color is painted explicitly so the page holds on any host ground. */
  :root {
    color-scheme: light;
    --ground: #f6f8fc;
    --panel: #ffffff;
    --line: #dde4ef;
    --ink: #121a26;
    --ink-2: #4b5869;
    --ink-3: #7c8799;
    --teal: #157a74;
    --teal-soft: #d6ecea;
    --display: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    min-height: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding-block: clamp(18px, 3.2vh, 40px);
    padding-left: 24px;
    padding-right: 24px;
    display: flex;
    flex-direction: column;
    gap: clamp(12px, 2.2vh, 24px);
  }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }

  h1 {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(28px, 3.8vw, 46px);
    letter-spacing: -.028em;
    line-height: 1.04;
    margin: 0 0 6px;
  }
  h1 b { color: var(--teal); font-weight: 700; }

  .sub {
    margin: 0;
    font-size: clamp(15px, 1.5vw, 19px);
    color: var(--ink-2);
    line-height: 1.4;
  }

  .stats {
    display: flex;
    gap: clamp(16px, 2.4vw, 32px);
    flex-wrap: wrap;
  }
  .stat .v {
    display: block;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(22px, 2.6vw, 32px);
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    line-height: 1.05;
  }
  .stat .v.good { color: var(--teal); }
  .stat .k {
    display: block;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: .04em;
    margin-top: 3px;
  }

  /* ---------- the nodes ---------- */

  .nodes {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: clamp(10px, 1.4vw, 18px);
  }

  .node {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(18,26,38,.04), 0 6px 18px rgba(18,26,38,.04);
  }
  .node header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .node header .name { color: var(--ink-2); }
  .node header .fill { color: var(--teal); font-weight: 500; }

  .node svg { display: block; width: 100%; height: auto; }

  .ring { fill: none; stroke: var(--ink-2); stroke-opacity: .7; }
  .disc { fill: var(--teal); fill-opacity: .72; transform-box: fill-box; transform-origin: center; }

  /* Usage moves; it never leaves its ring. That is what "consuming what it
     needs" looks like over time, rather than in one frozen frame. */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(.93); }
    }
    .disc { animation: breathe var(--d, 6s) ease-in-out var(--o, 0s) infinite; }
  }

  /* ---------- legend ---------- */

  .legend {
    display: flex;
    gap: clamp(14px, 2vw, 26px);
    align-items: center;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--ink-2);
  }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }
  .legend b { color: var(--ink); font-weight: 650; }
  .legend .tag {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-3);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 3px 8px;
  }

  @media (max-width: 900px) {
    .nodes { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .nodes { grid-template-columns: minmax(0, 1fr); }
    .legend .tag { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="page">
  <header>
    <div>
      <h1>Every pod, <b>right-sized</b>.</h1>
      <p class="sub">Each one asked for what it uses. Nothing bursting, nothing stranded.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="nodes" id="nodes"></div>

  <div class="legend">
    <span>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5" fill="none" stroke="#7c8799" stroke-width="1.5" stroke-dasharray="3.5 2.5"></circle>
      </svg>
      <b>Ring</b>&nbsp;what it asked for
    </span>
    <span>
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9.5" fill="#157a74" fill-opacity="0.72"></circle>
      </svg>
      <b>Disc</b>&nbsp;what it is using
    </span>
    <span class="tag">Illustrative</span>
  </div>
</div>

<script>
(() => {
  "use strict";

  // Seeded, so the picture is the same on every load and in every screenshot.
  function rng(seed) {
    return () => {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rand = rng(20260929);

  const NODES = 6;
  const W = 400, H = 214;          // each node's drawing area, in viewBox units
  const ALLOC_MI = 14 * 1024;      // an m5.xlarge's allocatable memory, roughly

  // A realistic spread of pod sizes: mostly small services, a long tail of
  // larger ones. Log-uniform between 24Mi and 640Mi.
  const podSize = () => Math.round(Math.exp(Math.log(24) + rand() * (Math.log(640) - Math.log(24))));

  let totalPods = 0, totalReq = 0, totalUse = 0;
  const host = document.getElementById("nodes");

  for (let n = 0; n < NODES; n++) {
    // Fill each node to a realistic, efficient request level: packing works
    // when requests are honest, so nodes can be run fuller than usual.
    const target = ALLOC_MI * (0.78 + rand() * 0.08);
    const pods = [];
    let req = 0;
    while (req < target) {
      const r = podSize();
      if (req + r > target * 1.02) break;
      // Right-sized: usage sits between 66% and 86% of what was asked for,
      // close to the request with a margin, rather than flush against it.
      const u = r * (0.66 + rand() * 0.20);
      pods.push({ req: r, use: u });
      req += r;
    }
    const use = pods.reduce((a, p) => a + p.use, 0);
    totalPods += pods.length; totalReq += req; totalUse += use;

    const root = d3.hierarchy({ children: pods }).sum((d) => d.req || 0);
    d3.pack().size([W, H]).padding(1.8)(root);

    const card = document.createElement("section");
    card.className = "node";
    card.innerHTML = `
      <header>
        <span class="name">node-${n + 1} &middot; ${pods.length} pods</span>
        <span class="fill">${Math.round((req / ALLOC_MI) * 100)}% requested &middot; ${Math.round((use / ALLOC_MI) * 100)}% used</span>
      </header>`;
    host.appendChild(card);

    const svg = d3.select(card).append("svg")
      .attr("viewBox", `0 0 ${W} ${H}`)
      .attr("role", "img")
      .attr("aria-label", `Node ${n + 1}: ${pods.length} pods, each using close to what it requested`);

    // Packing produces an enclosing circle; center it in the wider box.
    const dx = (W - 2 * root.r) / 2 + root.r - root.x;
    const g = svg.append("g").attr("transform", `translate(${dx},0)`);

    const leaves = g.selectAll("g").data(root.leaves()).join("g")
      .attr("transform", (d) => `translate(${d.x},${d.y})`);

    leaves.append("circle")
      .attr("class", "disc")
      .attr("r", (d) => d.r * Math.sqrt(d.data.use / d.data.req))
      .attr("style", () => `--d:${(5 + rand() * 4).toFixed(2)}s;--o:-${(rand() * 8).toFixed(2)}s`);

    leaves.append("circle")
      .attr("class", "ring")
      .attr("r", (d) => d.r)
      .attr("stroke-width", (d) => (d.r > 7 ? 1.1 : 0.8))
      .attr("stroke-dasharray", (d) => (d.r > 7 ? "2.6 1.8" : "1.6 1.2"));
  }

  const pct = (v) => `${Math.round(v * 100)}%`;
  document.getElementById("stats").innerHTML = [
    [NODES, "nodes"],
    [totalPods, "pods"],
    [pct(totalReq / (ALLOC_MI * NODES)), "requested", true],
    [pct(totalUse / totalReq), "of requests in use", true],
  ].map(([v, k, good]) => `<div class="stat"><span class="v${good ? " good" : ""}">${v}</span><span class="k">${k}</span></div>`).join("");
})();
</script>

</body>
</html>
